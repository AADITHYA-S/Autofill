<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AutoForm — Register</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="register.css">
</head>

<body>

<main class="auth-page">

    <section class="auth-card">

        <a class="brand" href="../../index.html" data-authenticated-href="../dashboard/dashboard.html">
            <span class="brand-mark">A</span>
            <span>AutoForm</span>
        </a>

        <div class="heading">
            <p class="eyebrow">GET STARTED</p>

            <h1>Create your AutoForm account</h1>

            <p>
                Create a secure identity profile that can be used
                for consent-based form autofill.
            </p>
        </div>

        <form id="registerForm" novalidate>

            <div class="field">
                <label for="phone">Phone number</label>

                <input
                    id="phone"
                    name="phone"
                    type="tel"
                    autocomplete="tel"
                    placeholder="Enter your phone number"
                    required
                >

                <small class="field-error" id="phoneError"></small>
            </div>

            <div class="field">
                <label for="password">Password</label>

                <div class="password-wrap">
                    <input
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="new-password"
                        placeholder="Create a password"
                        required
                    >

                    <button
                        class="show-password"
                        id="showPassword"
                        type="button"
                    >
                        Show
                    </button>
                </div>

                <small class="password-hint">
                    Use a password you can keep secure.
                </small>

                <small class="field-error" id="passwordError"></small>
            </div>

            <div class="field">
                <label for="confirmPassword">Confirm password</label>

                <input
                    id="confirmPassword"
                    name="confirmPassword"
                    type="password"
                    autocomplete="new-password"
                    placeholder="Enter your password again"
                    required
                >

                <small
                    class="field-error"
                    id="confirmPasswordError"
                ></small>
            </div>

            <label class="consent">
                <input
                    id="consent"
                    name="consent"
                    type="checkbox"
                >

                <span class="checkmark"></span>

                <span class="consent-text">
                    I understand that AutoForm may use my saved
                    information for consent-based autofill.
                </span>
            </label>

            <small class="field-error" id="consentError"></small>

            <div
                class="form-error"
                id="formError"
                role="alert"
                aria-live="polite"
            ></div>

            <button
                class="primary-button"
                id="registerButton"
                type="submit"
            >
                <span id="registerButtonText">Create account</span>
                <span id="registerSpinner" class="spinner" hidden></span>
            </button>

        </form>

        <div class="divider">
            <span>Already have an account?</span>
        </div>

        <a class="secondary-button" href="../login/login.html">
            Sign in
        </a>

        <p class="privacy-note">
            Your account and identity information are protected.
        </p>

    </section>

</main>

<script src="../../js/api.js"></script>
<script src="../../js/auth.js"></script>
<script src="register.js"></script>

</body>
</html>
